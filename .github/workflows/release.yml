name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: python -m pip install "jupyterlab>=4.5,<4.6" build

      - name: Build wheel
        run: python -m build --wheel

      - name: Check the extension installs
        run: |
          pip install dist/*.whl
          jupyter labextension list 2>&1 | grep -ie "jupyterlab_gruvbox_material.*OK"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.whl
          body: |
            Gruvbox Material theme for JupyterLab 4.

            ```
            pip install -U jupyterlab-gruvbox-material
            ```
            Then restart JupyterLab and choose **Settings → Theme → Gruvbox Material**.

            On JupyterLab 3 use `pip install "jupyterlab-gruvbox-material<2"`.

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
