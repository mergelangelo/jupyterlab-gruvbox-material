name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build tools
        run: python -m pip install "jupyterlab==3.4.*" "jupyter_packaging~=0.7.9" build wheel "setuptools<70"

      - name: Build wheel
        run: |
          jlpm install --frozen-lockfile
          python -m build --wheel --no-isolation

      - name: Check the extension installs
        run: |
          pip install dist/*.whl
          jupyter labextension list 2>&1 | grep -ie "jupyterlab_gruvbox_material.*OK"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.whl

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          body: |
            Gruvbox Material theme for JupyterLab 3.

            ```
            pip install jupyterlab-gruvbox-material
            ```
            Then restart JupyterLab and choose **Settings → Theme → Gruvbox Material**.

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
