[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.5,<4.6", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab_gruvbox_material"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Themes",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dependencies = []
dynamic = ["version", "description", "authors", "urls", "keywords"]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlab_gruvbox_material/labextension"]
exclude = [".github", "docs"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_gruvbox_material/labextension" = "share/jupyter/labextensions/jupyterlab_gruvbox_material"
"install.json" = "share/jupyter/labextensions/jupyterlab_gruvbox_material/install.json"

[tool.hatch.build.hooks.version]
path = "jupyterlab_gruvbox_material/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_gruvbox_material/labextension/package.json",
    "jupyterlab_gruvbox_material/labextension/themes/jupyterlab_gruvbox_material/index.css",
]
skip-if-exists = ["jupyterlab_gruvbox_material/labextension/package.json"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyterlab_gruvbox_material/labextension"
